[project]
name = "xianyu-mcp-server"
version = "1.0.0"
description = "基于 pyxianyu 的闲鱼 MCP 服务（Goofish MCP Server by DoLovya）"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "pyxianyu>=1.0.0,<2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "websockets>=12.0",
    "msgpack>=1.0.0",
    "blackboxprotobuf>=1.0.1",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "python-socks>=2.8.2",
    "qrcode[pil]>=7.4.2",
]

[project.scripts]
xianyu-mcp-server = "xianyu_mcp.server:main"

[tool.uv.sources]
pyxianyu = { path = "third_party/pyxianyu", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/xianyu_mcp"]
include = ["src/xianyu_mcp/static/**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
