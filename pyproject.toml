[project]
name = "xianyu-mcp"
version = "0.1.0"
description = "基于 pyxianyu 的闲鱼 MCP 服务"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "python-dotenv>=1.2.2",
    "pyxianyu>=0.1.0",
    "requests>=2.34.2",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "websockets>=17.0.1",
    "msgpack>=1.2.1",
    "blackboxprotobuf>=1.0.1",
    "pydantic>=2.13.4",
    "typing-extensions>=4.16.0",
    "python-socks>=2.8.2",
    "qrcode[pil]>=8.2",
]

[project.scripts]
xianyu-mcp = "xianyu_mcp.server:main"

[tool.uv.sources]
pyxianyu = { path = "third_party/pyxianyu", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/xianyu_mcp"]
include = ["src/xianyu_mcp/static/**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
