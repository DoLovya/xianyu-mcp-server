name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    env:
      UV_INDEX_URL: ${{ vars.UV_INDEX_URL }}
      UV_EXTRA_INDEX_URL: ${{ vars.UV_EXTRA_INDEX_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv
          uv pip install third_party/pyxianyu
          uv pip install -e .
      - name: Run tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - name: Install-mode import (no submodule)
        run: |
          rm -rf third_party/pyxianyu
          uv run python -c "import xianyu_mcp; from xianyu_mcp.tools.xianyu_api_tools import _load_xianyu_modules; _load_xianyu_modules(); print('ok')"

  build:
    name: Build (Python 3.11)
    runs-on: ubuntu-latest
    needs: test
    env:
      UV_INDEX_URL: ${{ vars.UV_INDEX_URL }}
      UV_EXTRA_INDEX_URL: ${{ vars.UV_EXTRA_INDEX_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv
          uv pip install third_party/pyxianyu
          uv pip install -e .
      - name: Build wheel and sdist
        run: |
          uv pip install build
          uv run python -m build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
