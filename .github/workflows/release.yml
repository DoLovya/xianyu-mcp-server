name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Resolve release inputs
        id: resolve
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os

          event_name = os.environ["GITHUB_EVENT_NAME"]
          tag = os.environ.get("GITHUB_REF_NAME", "")
          manual_checkout = "false"

          if event_name == "workflow_dispatch":
              with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
                  payload = json.load(f)
              inputs = payload.get("inputs") or {}
              tag = (inputs.get("tag") or "").strip()
              manual_checkout = "true"

          if not tag:
              raise SystemExit("Missing release tag. For manual dispatch, provide inputs.tag such as v1.0.0")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"manual_checkout={manual_checkout}\n")
          PY
      - name: Checkout target tag for manual dispatch
        if: ${{ steps.resolve.outputs.manual_checkout == 'true' }}
        run: |
          git fetch --force --tags origin "refs/tags/${{ steps.resolve.outputs.tag }}:refs/tags/${{ steps.resolve.outputs.tag }}"
          git checkout --detach "refs/tags/${{ steps.resolve.outputs.tag }}"
          git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Release precheck
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import os
          import re
          import tomllib
          tag = os.environ.get("TAG", "")
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:[-+].+)?", tag):
              msg = [
                  f"Tag format invalid: {tag!r}. Expected vX.Y.Z（必须带前缀 v，例如 v1.0.0）",
                  "正确打 tag 命令（推荐，无 GPG 依赖）：git tag -a v1.0.0 -m 'Release xianyu-mcp-server 1.0.0'",
                  "若本机已配置 GPG 签名，也可使用：git tag -s v1.0.0 -m 'Release xianyu-mcp-server 1.0.0'",
                  "若打错 tag，删除并重打：git tag -d v1.0.0 && git push --delete origin v1.0.0",
              ]
              raise SystemExit("\n".join(msg))
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          version = (data.get("project", {}) or {}).get("version", "")
          if not version:
              raise SystemExit("pyproject.toml missing [project].version")
          if tag.lstrip("v") != version:
              msg = [
                  f"Version mismatch: tag={tag.lstrip('v')!r} 与 pyproject.version={version!r} 不相等",
                  f"请删除错误 tag 后重新打：",
                  f"  git tag -d {tag} && git push --delete origin {tag} 2>/dev/null || true",
                  f"  git tag -a v{version} -m 'Release xianyu-mcp-server {version}'",
                  f"  git push origin v{version}",
              ]
              raise SystemExit("\n".join(msg))
          print(f"OK: tag={tag} version={version}")
          PY
      - name: Build wheel and sdist
        run: |
          python -m build
          ls -la dist
      - name: Validate distributions
        run: |
          python -m twine check dist/*
      - name: Install wheel and smoke test (end-user mode)
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/python -m pip install --upgrade pip
          /tmp/smoke-venv/bin/python -m pip install dist/*.whl
          echo "--- import smoke ---"
          /tmp/smoke-venv/bin/python -c "
            import xianyu_mcp
            import os
            from pathlib import Path
            expected = os.environ['TAG'].lstrip('v')
            assert xianyu_mcp.__version__ == expected, f'version mismatch: {xianyu_mcp.__version__} vs {expected}'
            from xianyu_mcp.tools.xianyu_api_tools import _load_xianyu_modules
            _load_xianyu_modules()
            entrypoint = Path('/tmp/smoke-venv/bin/xianyu-mcp-server')
            assert entrypoint.exists(), f'entrypoint missing: {entrypoint}'
            print('import ok, version:', xianyu_mcp.__version__)
          "
          echo "--- entrypoint smoke (xianyu-mcp-server) ---"
          /tmp/smoke-venv/bin/xianyu-mcp-server --help > /dev/null || {
            echo "WARNING: entrypoint xianyu-mcp-server --help failed (may require stdio); trying module call"
            /tmp/smoke-venv/bin/python -m xianyu_mcp.server --help > /dev/null
          }
          echo "wheel install smoke: OK"
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
