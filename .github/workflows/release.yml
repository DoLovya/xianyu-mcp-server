name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
      publish_pypi:
        type: boolean
        required: false
        default: false
      pypi_via_token:
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      UV_INDEX_URL: ${{ vars.UV_INDEX_URL }}
      UV_EXTRA_INDEX_URL: ${{ vars.UV_EXTRA_INDEX_URL }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Release precheck
        run: |
          python - <<'PY'
          from __future__ import annotations
          import os
          import re
          import tomllib
          tag = os.environ.get("TAG", "")
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:[-+].+)?", tag):
              msg = [
                  f"Tag format invalid: {tag!r}. Expected vX.Y.Z（必须带前缀 v，例如 v1.0.0）",
                  "正确打 tag 命令（推荐，无 GPG 依赖）：git tag -a v1.0.0 -m 'Release xianyu-mcp-server 1.0.0'",
                  "若本机已配置 GPG 签名，也可使用：git tag -s v1.0.0 -m 'Release xianyu-mcp-server 1.0.0'",
                  "若打错 tag，删除并重打：git tag -d v1.0.0 && git push --delete origin v1.0.0",
              ]
              raise SystemExit("\n".join(msg))
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          version = (data.get("project", {}) or {}).get("version", "")
          if not version:
              raise SystemExit("pyproject.toml missing [project].version")
          if tag.lstrip("v") != version:
              msg = [
                  f"Version mismatch: tag={tag.lstrip('v')!r} 与 pyproject.version={version!r} 不相等",
                  f"请删除错误 tag 后重新打：",
                  f"  git tag -d {tag} && git push --delete origin {tag} 2>/dev/null || true",
                  f"  git tag -a v{version} -m 'Release xianyu-mcp-server {version}'",
                  f"  git push origin v{version}",
              ]
              raise SystemExit("\n".join(msg))
          print(f"OK: tag={tag} version={version}")
          PY
      - name: Build wheel and sdist
        run: |
          uv pip install build
          uv run python -m build
          ls -la dist
      - name: Install wheel and smoke test (end-user mode)
        run: |
          uv venv --python 3.11 /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          echo "--- import smoke ---"
          /tmp/smoke-venv/bin/python -c "
            import xianyu_mcp
            assert xianyu_mcp.__version__ == '${{ env.TAG }}'.lstrip('v'), f'version mismatch: {xianyu_mcp.__version__} vs ${{ env.TAG }}'
            from xianyu_mcp.tools.xianyu_api_tools import _load_xianyu_modules
            _load_xianyu_modules()
            print('import ok, version:', xianyu_mcp.__version__)
          "
          echo "--- entrypoint smoke (xianyu-mcp-server) ---"
          /tmp/smoke-venv/bin/xianyu-mcp-server --help > /dev/null || {
            echo "WARNING: entrypoint xianyu-mcp-server --help failed (may require stdio); trying module call"
            /tmp/smoke-venv/bin/python -m xianyu_mcp.server --help > /dev/null || true
          }
          echo "wheel install smoke: OK"
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          fail_on_unmatched_files: true
      - name: Publish to PyPI (Trusted Publishing)
        if: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi && !inputs.pypi_via_token) }}
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to PyPI (API Token)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_pypi && inputs.pypi_via_token && secrets.PYPI_API_TOKEN != '') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
